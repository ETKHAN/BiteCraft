name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run automated rule tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Support direct nested-route requests on GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Create submission source ZIP
        run: zip -r '24i-2118_EtizazAli_BCY-5A_A#02.zip' . -x 'node_modules/*' 'dist/*' '.git/*' '*.zip'

      - name: Upload submission source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BiteCraft-source-code-ZIP
          path: '24i-2118_EtizazAli_BCY-5A_A#02.zip'
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
